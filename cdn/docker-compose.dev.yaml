services:
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: cdn-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: braingain
      RUSTFS_SECRET_KEY: braingain-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
    volumes:
      - s3-data:/data

volumes:
  s3-data:
