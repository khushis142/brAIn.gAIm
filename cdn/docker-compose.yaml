# Production stack for Portainer (GitOps). Configure the variables below as
# stack environment variables; RustFS is provided externally on the braingain network.
services:
  cdn:
    # Deployed version, updated after CI publishes (matches version.txt)
    image: ghcr.io/brain-gaim/cdn:0.0.1
    container_name: cdn
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:8081}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-braingain}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_USE_PATH_STYLE: "true"

networks:
  default:
    name: braingain
