<section>
  <div class="flex flex-row gap-3">
    <svg lucideSettings></svg>
    <h2>Settings</h2>
  </div>

  <div class="card">
    <h3>User Settings</h3>
    <button class="settings-button" type="button" (click)="openInterestDialog()">Interests</button>
    <div class="logout-button-container">
      <button class="settings-button logout-button" type="button" (click)="logout()">Logout</button>
    </div>
  </div>
</section>

@if (isInterestDialogOpen()) {
  <div class="modal-backdrop" (click)="closeInterestDialog()">
    <section
      class="interest-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="interest-dialog-title"
      (click)="$event.stopPropagation()"
    >
      <h3 id="interest-dialog-title">Add Interests</h3>
      <form (ngSubmit)="submit()">
        <label for="interest">Interest</label>
        <input
          id="interest"
          name="interest"
          type="text"
          [(ngModel)]="interest"
          required
          autofocus
          placeholder="e.g. astronomy"
        />
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <div class="dialog-actions">
          <button class="cancel-button" type="button" (click)="closeInterestDialog()">Cancel</button>
          <button
            class="add-interest-button"
            type="submit"
            [disabled]="!interest.trim() || submitting()"
          >
            {{ submitting() ? 'Saving...' : 'Add Interests' }}
          </button>
        </div>
      </form>
    </section>
  </div>
}
