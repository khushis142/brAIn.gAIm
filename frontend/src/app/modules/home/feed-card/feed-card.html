@let item = entry().item;
<article class="card">
  <div class="stage">
    @if (live()) {
      @if (item.type === 'video') {
        <app-feed-video
          [item]="item"
          [active]="allowance() !== 'paused'"
          [startAt]="videoTime"
          (timeChange)="videoTime = $event"
          (doubleTapped)="liked.set(true)"
        />
      } @else {
        <app-feed-game
          [item]="item"
          [allowance]="allowance()"
          [finishedResult]="gameResult()"
          (finished)="gameResult.set($event)"
        />
      }
    }
  </div>

  <footer class="info">
    <div class="meta">
      <span class="kind">{{ item.type }}</span>
      <h2 class="title" [title]="item.title">{{ item.title }}</h2>
    </div>
    @if (item.type === 'video') {
      <button
        class="like"
        type="button"
        [class.liked]="liked()"
        [attr.aria-pressed]="liked()"
        aria-label="Like"
        (click)="liked.set(!liked())"
      >
        <svg lucideBrain></svg>
      </button>
    }
    <nav class="nav" aria-label="Feed">
      <button
        class="previous"
        type="button"
        [disabled]="!hasPrevious()"
        (click)="previous.emit()"
        aria-label="Previous item"
      >
        <svg lucideChevronUp></svg>
      </button>
      <button
        class="next"
        type="button"
        [disabled]="gameOwnsInput()"
        [attr.title]="gameOwnsInput() ? 'Finish the game to continue' : null"
        [attr.aria-label]="gameOwnsInput() ? 'Finish the game to continue' : 'Next item'"
        (click)="next.emit()"
      >
        @if (gameOwnsInput()) {
          <svg lucideLock></svg>
        } @else {
          <svg lucideChevronDown></svg>
        }
      </button>
    </nav>
  </footer>
</article>
