<video
  #video
  class="video"
  [src]="item().url"
  [muted]="muted()"
  [volume]="volume()"
  loop
  playsinline
  (loadedmetadata)="onLoadedMetadata($event)"
  (timeupdate)="onTimeUpdate($event)"
></video>

@if (isSeeking()) {
  <output class="seek-timestamp" aria-live="polite">{{ seekTimestamp() }}</output>
}

@if (playbackBubble(); as action) {
  <span class="playback-bubble" aria-hidden="true">
    @if (action === 'play') {
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
    } @else {
      <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
    }
  </span>
}

<div class="player-controls" [class.visible]="arePlayerControlsVisible()">
  <div class="timeline">
    <input
      class="seek-input"
      type="range"
      min="0"
      [max]="duration()"
      step="0.1"
      [value]="currentTime()"
      [style.--seek-progress.%]="playheadPercent()"
      aria-label="Video progress"
      (pointerdown)="onSeekStart($event)"
      (input)="onSeekInput($event)"
      (pointerup)="onSeekEnd($event)"
      (pointercancel)="onSeekEnd($event)"
      (change)="onSeekEnd($event)"
    />
    <span class="brain-playhead" [style.left.%]="playheadPercent()" aria-hidden="true">
      <span class="material-symbols-outlined">network_intelligence</span>
    </span>
  </div>
</div>

<div class="tap-layer" (pointerdown)="onTapStart($event)" (pointerup)="onTapEnd($event)">
  @for (burst of bursts(); track burst.id) {
    <svg lucideBrain class="burst" [style.left.px]="burst.x" [style.top.px]="burst.y"></svg>
  }
</div>
