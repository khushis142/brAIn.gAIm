<div
  class="health-badge"
  [class.healthy]="status() === 'Healthy'"
  [class.unavailable]="status() === 'Unavailable'"
  aria-live="polite"
  role="status"
  [attr.aria-label]="service() + ': ' + status()"
  (pointerdown)="startHold()"
  (pointerup)="cancelHold()"
  (pointerleave)="cancelHold()"
  (pointercancel)="cancelHold()"
  (click)="onClick()"
  (contextmenu)="preventContextMenu($event)"
>
  <span class="material-symbols-outlined" aria-hidden="true">{{ icon() }}</span>
  @if (showStatusPopup()) {
    <span class="status-popup" [class.fading]="fadingStatusPopup()" role="status">
      {{ service() === 'CDN' ? 'Content Delivery Network' : 'Backend' }}: {{ status() }}
    </span>
  }
</div>
